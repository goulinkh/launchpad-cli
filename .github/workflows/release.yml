name: Publish native releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate semantic version and manifests
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Check source and OpenAPI provenance
        run: npm run check
      - name: Test without production writes
        run: npm test

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.architecture }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            architecture: arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RUST_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"
      - name: Install and configure musl
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          {
            echo 'CC=musl-gcc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
          } >> "$GITHUB_ENV"
      - name: Build native binary
        run: cargo build --locked --release --target "$RUST_TARGET"
      - name: Smoke-test and package native binary
        run: node scripts/package-release.mjs "$RUST_TARGET"
      - name: Preserve native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launchpad-cli-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download all native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: launchpad-cli-*
          path: dist
          merge-multiple: true
      - name: Validate complete release and generate checksums
        run: node scripts/release-checksums.mjs
      - name: Publish archives without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=(--verify-tag --generate-notes --title "launchpad-cli $RELEASE_TAG")
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
