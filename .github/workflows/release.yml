name: Release native binaries

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Detect package release
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      npm_asset: ${{ steps.package.outputs.npm_asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Detect package version change and validate manifests
        id: package
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/detect-release.mjs

  verify:
    name: Verify source
    needs: metadata
    if: needs.metadata.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Check source and OpenAPI provenance
        run: npm run check
      - name: Test without production writes
        run: npm test

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.architecture }}
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            architecture: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            architecture: arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            architecture: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win32
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RUST_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"
      - name: Install and configure musl
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          {
            echo 'CC=musl-gcc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
          } >> "$GITHUB_ENV"
      - name: Build native binary
        run: cargo build --locked --release --target "$RUST_TARGET"
      - name: Smoke-test and package native binary
        run: node scripts/package-release.mjs "$RUST_TARGET"
      - name: Preserve native archive and npm binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launchpad-cli-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/*
            bin/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      NPM_ASSET: ${{ needs.metadata.outputs.npm_asset }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download all native archives and npm binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: launchpad-cli-*
          path: .
          merge-multiple: true
      - name: Assemble scoped npm package with all six native binaries
        run: node scripts/package-npm.mjs
      - name: Validate complete release and generate checksums
        run: node scripts/release-checksums.mjs
      - name: Preserve npm package for trusted publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launchpad-cli-npm
          path: dist/${{ needs.metadata.outputs.npm_asset }}
          if-no-files-found: error
          retention-days: 7
      - name: Create annotated tag and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          tag_object="$(gh api --method POST "repos/$GH_REPO/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="launchpad-cli $RELEASE_TAG" \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -f object="$GITHUB_SHA" -f type=commit --jq '.sha')"
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object"
          args=(--verify-tag --generate-notes --target "$GITHUB_SHA" --title "launchpad-cli $RELEASE_TAG")
          if [ "$PRERELEASE" = 'true' ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"

  publish:
    name: Publish npm package
    needs: [metadata, release]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      NPM_ASSET: ${{ needs.metadata.outputs.npm_asset }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.19.1
      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launchpad-cli-npm
          path: npm-dist
      - name: Publish npm package through OIDC
        run: |
          tag=latest
          if [ "$PRERELEASE" = 'true' ]; then
            tag=next
          fi
          npm publish "./npm-dist/$NPM_ASSET" --access public --tag "$tag"
