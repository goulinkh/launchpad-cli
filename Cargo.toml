[package]
name = "launchpad-cli"
version = "0.1.3"
edition = "2024"
description = "Standalone, agent-friendly Launchpad command line interface"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[[bin]]
name = "launchpad-cli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "string"] }
dirs = "6"
futures = "0.3"
flate2 = "1"
jsonschema = { version = "0.58", default-features = false }
openapi-schema-to-json-schema = "0.2"
openapiv3 = "2.2"
openapiv3-resolve = "0.2"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.13", features = ["form", "json"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
